name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  integrated-build-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-gcc, os: ubuntu-latest, cc: gcc, cxx: g++ }
          - { name: linux-clang, os: ubuntu-latest, cc: clang, cxx: clang++ }
          - { name: macos-clang, os: macos-latest, cc: clang, cxx: clang++ }
          - { name: windows-msvc, os: windows-latest, cc: cl, cxx: cl }
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: asterism-asngn
      - name: Read component pins
        id: pins
        shell: pwsh
        run: |
          $manifest = Get-Content asterism-asngn/release.json -Raw | ConvertFrom-Json
          foreach ($component in @('asper', 'astools', 'asmodel')) {
            "$component=$($manifest.components.$component.revision)" >> $env:GITHUB_OUTPUT
          }
      - uses: actions/checkout@v7
        with:
          repository: gslf/asterism-asper
          ref: ${{ steps.pins.outputs.asper }}
          path: asterism-asper
          submodules: recursive
      - uses: actions/checkout@v7
        with:
          repository: gslf/asterism-astools
          ref: ${{ steps.pins.outputs.astools }}
          path: asterism-astools
          submodules: recursive
      - uses: actions/checkout@v7
        with:
          repository: gslf/asterism-asmodel
          ref: ${{ steps.pins.outputs.asmodel }}
          path: asterism-asmodel
      - name: Verify component contracts
        run: python asterism-asngn/scripts/release.py --root .
      - name: Check shared xCDN pin
        shell: pwsh
        run: |
          $asper = git -C asterism-asper/deps/xcdn-c rev-parse HEAD
          $astools = git -C asterism-astools/deps/xcdn-c rev-parse HEAD
          if ($asper -ne $astools) { throw "xCDN pins differ: $asper != $astools" }
      - name: Configure asmodel
        working-directory: asterism-asmodel
        env:
          CC: ${{ matrix.cc }}
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DASMODEL_BUILD_TESTS=ON
      - name: Require HTTP conformance coverage
        working-directory: asterism-asmodel
        run: cmake --build build --config Release --target asmodel-openai-smoke -j 4
      - name: Build and test asmodel
        working-directory: asterism-asmodel
        run: cmake --build build --config Release -j 4 && ctest --test-dir build -C Release --output-on-failure
      - name: Configure Asper
        working-directory: asterism-asper
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DASPER_WITH_LLAMA=OFF -DASPER_BUILD_MCP=ON
      - name: Build and test Asper
        working-directory: asterism-asper
        run: cmake --build build --config Release -j 4 && ctest --test-dir build -C Release --output-on-failure
      - name: Configure astools
        working-directory: asterism-astools
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DASTOOLS_BUILD_MCP=ON
      - name: Build and test astools
        working-directory: asterism-astools
        run: cmake --build build --config Release -j 4 && ctest --test-dir build -C Release --output-on-failure
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Install SDK check tools
        working-directory: asterism-asngn/sdk
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Configure asngn
        working-directory: asterism-asngn
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DASNGN_WITH_LLAMA=OFF
      - name: Build asngn
        working-directory: asterism-asngn
        run: cmake --build build --config Release -j 4
      - name: Test asngn
        working-directory: asterism-asngn
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Install wheel builder
        if: matrix.name == 'linux-gcc'
        run: python -m pip install setuptools==84.0.0
      - name: Build and import SDK archives
        if: matrix.name == 'linux-gcc'
        working-directory: asterism-asngn
        run: python sdk/tests/package_smoke.py build/asngn-mcp "$(command -v node)" sdk/node_modules/typescript/bin/tsc

  linux-sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { path: asterism-asngn }
      - name: Read component pins
        id: pins
        shell: pwsh
        run: |
          $manifest = Get-Content asterism-asngn/release.json -Raw | ConvertFrom-Json
          foreach ($component in @('asper', 'astools', 'asmodel')) {
            "$component=$($manifest.components.$component.revision)" >> $env:GITHUB_OUTPUT
          }
      - uses: actions/checkout@v7
        with:
          repository: gslf/asterism-asper
          ref: ${{ steps.pins.outputs.asper }}
          path: asterism-asper
          submodules: recursive
      - uses: actions/checkout@v7
        with:
          repository: gslf/asterism-astools
          ref: ${{ steps.pins.outputs.astools }}
          path: asterism-astools
          submodules: recursive
      - uses: actions/checkout@v7
        with:
          repository: gslf/asterism-asmodel
          ref: ${{ steps.pins.outputs.asmodel }}
          path: asterism-asmodel
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Install SDK check tools
        working-directory: asterism-asngn/sdk
        run: npm ci --ignore-scripts --no-audit --no-fund
      - run: cmake -B build -DASNGN_WITH_LLAMA=OFF -DASNGN_SANITIZERS=ON
        working-directory: asterism-asngn
      - run: cmake --build build -j 4
        working-directory: asterism-asngn
      - run: ctest --test-dir build --output-on-failure
        working-directory: asterism-asngn
