name: real-model-smoke

on:
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-gguf-turn:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          path: asterism-asngn
      - uses: actions/checkout@v7
        with:
          repository: gslf/asterism-asper
          ref: 5cc2d37ebcf1644e91021cc55f02f79e383e526a
          path: asterism-asper
          submodules: recursive
      - uses: actions/checkout@v7
        with:
          repository: gslf/asterism-astools
          ref: 635e23e33c8aec72672fdde5e3376cd363e75d5c
          path: asterism-astools
          submodules: recursive
      - uses: actions/checkout@v7
        with:
          repository: gslf/asterism-asmodel
          ref: 85de855206a29e5522afb5a30410ad5c94997f4d
          path: asterism-asmodel
      - name: Cache verified GGUF sources
        uses: actions/cache@v4
        with:
          path: asterism-asngn/demo/models
          key: gguf-${{ hashFiles('asterism-asngn/scripts/models.manifest.tsv') }}
      - name: Build CPU runtime
        working-directory: asterism-asngn
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DASNGN_WITH_LLAMA=ON -DGGML_NATIVE=OFF
          cmake --build build -j 4
      - name: Fetch and verify pinned models
        working-directory: asterism-asngn
        run: scripts/fetch-models.sh demo --repair --install-tools
      - name: Run blocking coding quality suite
        working-directory: asterism-asngn
        run: |
          python3 tests/quality/run_quality.py \
            --asngn ./build/asngn --engine-root ./demo \
            --report ./build/quality-report.json \
            --artifacts ./build/quality-artifacts
      - name: Upload quality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coding-quality-report
          path: |
            asterism-asngn/build/quality-report.json
            asterism-asngn/build/quality-artifacts
